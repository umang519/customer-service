<template>
    <div class="slds-box slds-box_x-small slds-theme_default lead-routing-summary">
        <div class="slds-text-heading_small slds-m-bottom_small summary-title">Routing Summary</div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_medium">
                <lightning-spinner alternative-text="Loading lead routing summary" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="slds-text-color_error slds-p-around_small">
                <lightning-icon icon-name="utility:error" size="small" alternative-text="Error" class="slds-m-right_x-small"></lightning-icon>
                Unable to load the routing summary. Please contact your administrator.
            </div>
        </template>

        <template lwc:else>
            <dl class="slds-dl_horizontal slds-wrap">
                <dt class="slds-dl_horizontal__label slds-text-color_weak slds-truncate">Region</dt>
                <dd class="slds-dl_horizontal__detail slds-truncate">{region}</dd>

                <dt class="slds-dl_horizontal__label slds-text-color_weak slds-truncate">Industry</dt>
                <dd class="slds-dl_horizontal__detail slds-truncate">{industry}</dd>

                <dt class="slds-dl_horizontal__label slds-text-color_weak slds-truncate">Lead Source</dt>
                <dd class="slds-dl_horizontal__detail slds-truncate">{leadSource}</dd>

                <dt class="slds-dl_horizontal__label slds-text-color_weak slds-truncate">Owner</dt>
                <dd class="slds-dl_horizontal__detail slds-truncate">{ownerName}</dd>

                <dt class="slds-dl_horizontal__label slds-text-color_weak slds-truncate">Status</dt>
                <dd class="slds-dl_horizontal__detail slds-truncate">{status}</dd>
            </dl>
        </template>
    </div>
</template>
