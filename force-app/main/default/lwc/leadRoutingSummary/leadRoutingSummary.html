<template>
    <lightning-card title="Lead Routing Summary" icon-name="standard:lead">
        <template lwc:if={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading lead routing summary" size="small"></lightning-spinner>
            </div>
        </template>
        <template lwc:elseif={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">
                Unable to load lead routing summary.
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_small">
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <div class="slds-text-title slds-text-color_weak">Region</div>
                        <div class="slds-text-body_regular">{region}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <div class="slds-text-title slds-text-color_weak">Industry</div>
                        <div class="slds-text-body_regular">{industry}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <div class="slds-text-title slds-text-color_weak">Lead Source</div>
                        <div class="slds-text-body_regular">{leadSource}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <div class="slds-text-title slds-text-color_weak">Status</div>
                        <div class="slds-text-body_regular">{status}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-p-around_xx-small">
                        <div class="slds-text-title slds-text-color_weak">Owner</div>
                        <div class="slds-text-body_regular">
                            <lightning-record-view-form record-id={recordId} object-api-name="Lead">
                                <lightning-output-field field-name="OwnerId" variant="label-hidden"></lightning-output-field>
                            </lightning-record-view-form>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
