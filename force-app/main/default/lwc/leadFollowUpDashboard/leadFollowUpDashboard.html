<template>
    <lightning-card title="Lead Follow-Up Dashboard" icon-name="standard:lead">
        <div class="slds-p-around_medium">
            <template lwc:if={error}>
                <div class="slds-text-color_error slds-m-bottom_small">
                    {error}
                </div>
            </template>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Processing" size="small"></lightning-spinner>
            </template>

            <lightning-record-view-form record-id={recordId} object-api-name="Lead">
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={nameField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={companyField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={emailField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={phoneField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={statusField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={sourceField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={industryField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                        <lightning-output-field field-name={ownerField}></lightning-output-field>
                    </div>
                </div>
            </lightning-record-view-form>

            <div class="slds-m-top_medium">
                <lightning-combobox
                    name="status"
                    label="New Lead Status"
                    value={selectedStatus}
                    placeholder="Select a status"
                    options={statusOptions}
                    onchange={handleStatusChange}
                    disabled={isLoading}
                ></lightning-combobox>
            </div>

            <div class="slds-m-top_medium slds-grid slds-grid_align-spread">
                <lightning-button
                    label="Assign to Me"
                    title="Assign to Me"
                    variant="brand"
                    onclick={handleAssignToMe}
                    disabled={isLoading}
                ></lightning-button>
                <lightning-button
                    label="Update Status"
                    title="Update Status"
                    variant="brand"
                    onclick={handleUpdateStatus}
                    disabled={isLoadingOrNoStatus}
                ></lightning-button>
                <lightning-button
                    label="Create Follow-Up Task"
                    title="Create Follow-Up Task"
                    variant="brand"
                    onclick={handleCreateTask}
                    disabled={isLoading}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
