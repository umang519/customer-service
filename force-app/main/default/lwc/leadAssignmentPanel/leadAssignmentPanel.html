<template>
    <lightning-card title="Lead Assignment" icon-name="standard:lead">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <template lwc:if={lead.data}>
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label">Owner</label>
                    <div class="slds-form-element__control">{ownerName}</div>
                </div>
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label">Region</label>
                    <div class="slds-form-element__control">{region}</div>
                </div>
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label">Industry</label>
                    <div class="slds-form-element__control">{industry}</div>
                </div>
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label">Status</label>
                    <div class="slds-form-element__control">{status}</div>
                </div>
                <lightning-button
                    variant="brand"
                    label="Assign to Me"
                    title="Assign this lead to me"
                    onclick={handleAssignToMe}
                    disabled={isAssignDisabled}>
                </lightning-button>
            </template>
            <template lwc:elseif={lead.error}>
                <div class="slds-text-color_error">{errorMessage}</div>
            </template>
        </div>
    </lightning-card>
</template>
