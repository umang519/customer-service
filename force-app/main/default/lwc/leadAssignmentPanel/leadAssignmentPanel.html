<template>
    <lightning-card title="Lead Assignment" icon-name="standard:lead">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={wiredRecord.data}>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-1 lead-info-row">
                        <span class="lead-field-label">Owner</span>
                        <div class="slds-text-body_regular">{ownerName}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 lead-info-row">
                        <span class="lead-field-label">Region</span>
                        <div class="slds-text-body_regular">{region}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 lead-info-row">
                        <span class="lead-field-label">Industry</span>
                        <div class="slds-text-body_regular">{industry}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 lead-info-row">
                        <span class="lead-field-label">Status</span>
                        <div class="slds-text-body_regular">{status}</div>
                    </div>
                </div>
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Assign to Me"
                        variant="brand"
                        onclick={assignToMe}
                        disabled={isAssignDisabled}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:elseif={wiredRecord.error}>
                <div class="slds-text-color_error">Unable to load lead information.</div>
            </template>
        </div>
    </lightning-card>
</template>
