<template>
    <lightning-card title="Lead Assignment" icon-name="standard:lead">
        <div class="slds-m-around_medium">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading lead details" size="small"></lightning-spinner>
            </template>
            <template lwc:elseif={hasError}>
                <div class="slds-text-color_error">{errorMessage}</div>
            </template>
            <template lwc:else>
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label">Owner:</dt>
                    <dd class="slds-dl_horizontal__detail">{ownerName}</dd>

                    <dt class="slds-dl_horizontal__label">Region:</dt>
                    <dd class="slds-dl_horizontal__detail">{region}</dd>

                    <dt class="slds-dl_horizontal__label">Industry:</dt>
                    <dd class="slds-dl_horizontal__detail">{industry}</dd>

                    <dt class="slds-dl_horizontal__label">Status:</dt>
                    <dd class="slds-dl_horizontal__detail">{status}</dd>
                </dl>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Assign to Me"
                        variant="brand"
                        onclick={handleAssignToMe}
                        disabled={isButtonDisabled}>
                    </lightning-button>
                </div>

                <template lwc:if={isAssignedToMe}>
                    <p class="slds-text-color_weak slds-m-top_x-small">This lead is already assigned to you.</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
