<template>
    <lightning-card title='Opportunity Approval' icon-name='standard:opportunity'>
        <div class='slds-p-around_medium'>
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text='Processing' size='small'></lightning-spinner>
            </template>
            <template lwc:else>
                <div class='slds-text-heading_small slds-m-bottom_small'>
                    Status: <span class={statusClass}>{approvalStatus}</span>
                </div>
                <template lwc:if={showActions}>
                    <div class='slds-grid slds-gutters slds-m-top_medium'>
                        <div class='slds-col'>
                            <lightning-button variant='brand' label='Approve' onclick={handleApprove} disabled={isLoading} class='slds-m-right_x-small'></lightning-button>
                        </div>
                        <div class='slds-col'>
                            <lightning-button variant='destructive' label='Reject' onclick={handleReject} disabled={isLoading}></lightning-button>
                        </div>
                    </div>
                </template>
                <template lwc:elseif={isManager}>
                    <p class='slds-text-color_weak'>No approval actions available for the current status.</p>
                </template>
                <template lwc:else>
                    <p class='slds-text-color_weak'>Only the opportunity owner's manager can approve or reject this deal.</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
