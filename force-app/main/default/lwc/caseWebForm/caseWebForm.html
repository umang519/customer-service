<template>
    <div class="slds-box slds-theme_default slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Contact Support</h2>
        <template lwc:if={showForm}>
            <form onsubmit={handleSubmit}>
                <lightning-input
                    type="text"
                    label="Name"
                    value={customerName}
                    onchange={handleInputChange}
                    data-field="customerName"
                    required
                ></lightning-input>
                <lightning-input
                    type="email"
                    label="Email"
                    value={customerEmail}
                    onchange={handleInputChange}
                    data-field="customerEmail"
                    required
                ></lightning-input>
                <lightning-input
                    type="text"
                    label="Subject"
                    value={subject}
                    onchange={handleInputChange}
                    data-field="subject"
                    required
                ></lightning-input>
                <lightning-textarea
                    label="Description"
                    value={description}
                    onchange={handleInputChange}
                    data-field="description"
                    required
                ></lightning-textarea>
                <lightning-combobox
                    label="Priority"
                    value={priority}
                    options={priorityOptions}
                    onchange={handleInputChange}
                    data-field="priority"
                    required
                ></lightning-combobox>
                <div class="slds-m-top_medium">
                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Submit"
                        disabled={isLoading}
                        class="slds-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        type="button"
                        label="Cancel"
                        onclick={handleCancel}
                    ></lightning-button>
                </div>
            </form>
        </template>
        <template lwc:elseif={showSuccess}>
            <div class="slds-text-align_center">
                <lightning-icon
                    icon-name="utility:success"
                    alternative-text="Success"
                    variant="success"
                    size="large"
                ></lightning-icon>
                <p class="slds-text-heading_small slds-m-top_medium">
                    Thank you! Your case has been submitted.
                </p>
                <lightning-button
                    class="slds-m-top_medium"
                    label="Submit Another Request"
                    onclick={handleReset}
                ></lightning-button>
            </div>
        </template>
        <template lwc:if={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-top_medium" role="alert">
                <span class="slds-assistive-text">error</span>
                <h3>{errorMessage}</h3>
            </div>
        </template>
    </div>
</template>
