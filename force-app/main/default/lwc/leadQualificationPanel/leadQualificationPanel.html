<template>
    <lightning-card title="Lead Qualification" icon-name="standard:lead">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <div class="section-header slds-text-title_bold slds-m-bottom_small">Essential Information</div>
            <lightning-record-view-form
                record-id={recordId}
                object-api-name={leadObject}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-output-field field-name={nameField}></lightning-output-field>
                        <lightning-output-field field-name={companyField}></lightning-output-field>
                        <lightning-output-field field-name={titleField}></lightning-output-field>
                        <lightning-output-field field-name={emailField}></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-output-field field-name={phoneField}></lightning-output-field>
                        <lightning-output-field field-name={industryField}></lightning-output-field>
                        <lightning-output-field field-name={leadSourceField}></lightning-output-field>
                    </div>
                </div>
            </lightning-record-view-form>

            <div class="section-header slds-text-title_bold slds-m-top_medium slds-m-bottom_small">Qualification</div>
            <lightning-record-edit-form
                record-id={recordId}
                object-api-name={leadObject}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name={statusField}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name={ratingField}></lightning-input-field>
                    </div>
                </div>
                <div class="slds-m-top_small">
                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Save">
                    </lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
