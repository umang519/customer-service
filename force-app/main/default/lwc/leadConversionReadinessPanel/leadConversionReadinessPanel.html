<template>
    <lightning-card title="Lead Conversion Readiness" icon-name="standard:lead">
        <div class="slds-p-around_medium">
            <lightning-record-view-form record-id={recordId} object-api-name={leadObject}>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Name"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Company"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Email"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Phone"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Status"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Rating"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Industry"></lightning-output-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-output-field field-name="Owner"></lightning-output-field>
                    </div>
                </div>
            </lightning-record-view-form>

            <div class="slds-m-top_medium">
                <template lwc:if={isReady}>
                    <div class="slds-box slds-theme_success slds-theme_alert-texture">
                        <span class="slds-text-heading_small">Ready to Convert</span>
                        <p>This Lead has the required information for conversion.</p>
                    </div>
                </template>
                <template lwc:else>
                    <div class="slds-box slds-theme_warning slds-theme_alert-texture">
                        <span class="slds-text-heading_small">Not Ready to Convert</span>
                        <p>Last Name, Company, and Status are all required before conversion.</p>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
